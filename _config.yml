# ------------------------------------------------------------------------------
# NOTE: This site is NOT built with Jekyll.
#
# GitHub Pages is configured to deploy from GitHub Actions (build_type: workflow):
# .github/workflows/deploy.yml runs `python3 build_site.py` and publishes `_site/`.
# Site settings live in builder/config.py and _data/*.yml.
#
# This file is kept only so that, if Pages were ever switched back to
# "Deploy from a branch", Jekyll would not try to render the raw templates.
# ------------------------------------------------------------------------------
exclude:
  - "*"
