<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#FAF8F5"/>
  <rect x="2" y="2" width="796" height="496" fill="none" stroke="#E2DDD3" stroke-width="4"/>
  
  <!-- Subtle background grid -->
  <g stroke="#E2DDD3" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central Cute Canvas Frame -->
  <rect x="250" y="110" width="300" height="200" rx="12" fill="#FFFFFF" stroke="#1C1B18" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(28,27,24,0.06))"/>
  
  <!-- Broken Image Icon inside Canvas -->
  <g stroke="#1C1B18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Image border -->
    <rect x="330" y="150" width="140" height="100" rx="6" stroke="#847F75" stroke-dasharray="6,6"/>
    <!-- Broken crack -->
    <path d="M 370,150 L 390,175 L 380,195 L 410,215 L 400,250" stroke="#1C1B18" stroke-width="3"/>
    <!-- Sun / Moon -->
    <circle cx="360" cy="175" r="10" fill="#E2DDD3" stroke="#1C1B18"/>
    <!-- Mountain -->
    <polygon points="420,230 445,195 460,230" fill="#E2DDD3" stroke="#1C1B18"/>
  </g>

  <!-- Cute Phoenix Character -->
  <g transform="translate(400, 360)">
    <!-- Phoenix Body -->
    <path d="M -35,0 C -45,-30 -20,-55 0,-55 C 20,-55 45,-30 35,0 C 35,25 -35,25 -35,0 Z" fill="#1C1B18"/>
    
    <!-- Feather Crest -->
    <path d="M 0,-55 C -5,-70 -15,-75 -10,-85 C -5,-80 0,-70 0,-55 Z" fill="#1C1B18"/>
    <path d="M 0,-55 C 5,-70 15,-75 10,-85 C 5,-80 0,-70 0,-55 Z" fill="#1C1B18"/>
    <path d="M 0,-55 C 0,-72 0,-82 3,-90 C 0,-80 0,-68 0,-55 Z" fill="#1C1B18"/>

    <!-- Cute Eyes -->
    <circle cx="-12" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="12" cy="-35" r="4" fill="#FFFFFF"/>

    <!-- Beak -->
    <polygon points="0,-27 -7,-20 7,-20" fill="#FAF8F5"/>

    <!-- Cute Confused Mark -->
    <text x="32" y="-45" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1C1B18">?</text>
  </g>

  <!-- Minimal Typography Tag -->
  <rect x="310" y="420" width="180" height="32" rx="4" fill="#1C1B18"/>
  <text x="400" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="1">IMAGE NOT FOUND</text>
</svg>
