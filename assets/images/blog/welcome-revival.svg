<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124"/>
      <stop offset="50%" stop-color="#1F1A38"/>
      <stop offset="100%" stop-color="#0E0C1A"/>
    </linearGradient>
    <linearGradient id="phoenix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF79AC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#5A4077"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF79AC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="400" cy="225" r="180" fill="url(#glow-grad)" filter="blur(40px)"/>
  <circle cx="650" cy="120" r="100" fill="#FF79AC" fill-opacity="0.12" filter="blur(50px)"/>
  <circle cx="150" cy="320" r="120" fill="#7C3AED" fill-opacity="0.15" filter="blur(60px)"/>

  <!-- Geometric Accents -->
  <circle cx="400" cy="225" r="140" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="400" cy="225" r="170" fill="none" stroke="rgba(255, 121, 172, 0.15)" stroke-width="1"/>

  <!-- Central Star / Phoenix Emblem -->
  <g transform="translate(400, 195)">
    <!-- 4-point star -->
    <path d="M 0,-75 Q 5,-15 65,0 Q 5,15 0,75 Q -5,15 -65,0 Q -5,-15 0,-75 Z" fill="url(#phoenix-grad)" filter="drop-shadow(0 8px 24px rgba(255, 121, 172, 0.45))"/>
    <!-- Inner Highlight Star -->
    <path d="M 0,-45 Q 3,-10 40,0 Q 3,10 0,45 Q -3,10 -40,0 Q -3,-10 0,-45 Z" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Revival Badge Pill -->
  <g transform="translate(400, 310)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <text x="0" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FF79AC" text-anchor="middle" letter-spacing="2.5">OFFICIAL REVIVAL</text>
  </g>

  <!-- Headline Text -->
  <text x="400" y="365" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Welcome to the New RenderPhoenix</text>
  <text x="400" y="392" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.65)" text-anchor="middle" letter-spacing="0.5">Expanding Beyond Boundaries • 22 August 2026</text>
</svg>
