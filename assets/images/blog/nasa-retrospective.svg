<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nasa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B17"/>
      <stop offset="60%" stop-color="#101830"/>
      <stop offset="100%" stop-color="#1A122E"/>
    </linearGradient>
    <linearGradient id="lunar-dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="award-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#nasa-bg)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="95" cy="65" r="1.5" opacity="0.8"/>
    <circle cx="180" cy="110" r="1.2" opacity="0.6"/>
    <circle cx="270" cy="45" r="1.8" opacity="0.9"/>
    <circle cx="380" cy="90" r="1.0" opacity="0.5"/>
    <circle cx="520" cy="55" r="1.5" opacity="0.7"/>
    <circle cx="640" cy="80" r="2.0" opacity="0.85"/>
    <circle cx="720" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="190" r="1.0" opacity="0.4"/>
    <circle cx="750" cy="160" r="1.5" opacity="0.7"/>
  </g>

  <!-- Earth in Sky -->
  <g transform="translate(660, 110)">
    <circle cx="0" cy="0" r="42" fill="#1E40AF" filter="drop-shadow(0 0 20px rgba(0, 240, 255, 0.4))"/>
    <circle cx="-8" cy="-6" r="34" fill="#3B82F6" opacity="0.6"/>
    <path d="M -15,-10 Q 5,-25 15,-5 Q 25,10 5,20 Q -20,25 -25,0 Z" fill="#10B981" opacity="0.8"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
  </g>

  <!-- Lunar Surface Horizon -->
  <path d="M 0,310 Q 200,270 400,290 T 800,280 L 800,450 L 0,450 Z" fill="#1E2235"/>
  <path d="M 0,335 Q 250,305 500,325 T 800,315 L 800,450 L 0,450 Z" fill="#151827"/>

  <!-- Lunar Habitat Dome Simulation -->
  <g transform="translate(380, 285)">
    <!-- Habitat Base -->
    <ellipse cx="0" cy="15" rx="140" ry="25" fill="#0D0F1A"/>
    <!-- Wireframe Dome -->
    <path d="M -120,15 A 120,110 0 0,1 120,15 Z" fill="url(#lunar-dome)" stroke="#00F0FF" stroke-width="2" opacity="0.85"/>
    <path d="M -85,15 A 85,80 0 0,1 85,15 Z" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    <path d="M -50,15 A 50,45 0 0,1 50,15 Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="-95" x2="0" y2="15" stroke="#00F0FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="-60" y1="-75" x2="60" y2="15" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="-75" x2="-60" y2="15" stroke="#00F0FF" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Badge / Ribbon -->
  <g transform="translate(400, 70)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="rgba(124, 58, 237, 0.35)" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="-115" cy="0" r="5" fill="url(#award-grad)"/>
    <text x="5" y="5" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">NASA SPACE APPS 2025</text>
  </g>

  <!-- Title Bottom Overlay -->
  <rect x="0" y="360" width="800" height="90" fill="linear-gradient(180deg, transparent 0%, rgba(10, 12, 20, 0.95) 100%)"/>
  <text x="400" y="395" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Engineering a Lunar Settlement</text>
  <text x="400" y="420" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">Global Nominee Retrospective • Physics &amp; Life Support</text>
</svg>
