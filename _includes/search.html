<dialog class="search-dialog" id="search-dialog" aria-label="Search">
  <form method="dialog" class="search-box" role="search">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label for="search-input" class="visually-hidden">Search projects, posts and pages</label>
    <input type="search" id="search-input" placeholder="Search projects, posts, pages…" autocomplete="off" spellcheck="false">
    <button type="submit" class="search-close" aria-label="Close search"><kbd>Esc</kbd></button>
  </form>
  <ul class="search-results" id="search-results" aria-live="polite"></ul>
</dialog>
