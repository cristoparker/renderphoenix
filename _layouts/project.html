---
layout: default
---
<article class="project">
  <header class="page-head container">
    <a class="back-link" href="/work/">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      All work
    </a>
    <h1>{{ page.title }}</h1>
    <p class="lead">{{ page.description }}</p>
    <p class="meta-line">{{ meta_line }}</p>
    {{ award }}
  </header>

  <div class="container">
    <figure class="project-cover">{{ cover }}</figure>
    <div class="project-layout">
      <div class="prose">
        {{ content }}
      </div>
      <aside class="project-aside" aria-label="Project details">
        <div class="aside-box">
          {{ actions }}
          {{ specs }}
        </div>
      </aside>
    </div>
  </div>
</article>
