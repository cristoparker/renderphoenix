---
layout: default
---
<article class="article">
  <header class="article-head container-narrow">
    <a class="back-link" href="/blog/">
      <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      All posts
    </a>
    <p class="eyebrow">{{ page.category }} · <time datetime="{{ page.date_iso }}">{{ page.date }}</time></p>
    <h1>{{ page.title }}</h1>
    <p class="lead">{{ page.description }}</p>
    <p class="byline">By {{ page.author }}</p>
  </header>
  <div class="container-wide">{{ cover }}</div>
  <div class="container-narrow">
    <div class="prose">
      {{ content }}
    </div>
    <footer class="article-foot">
      {{ tags }}
      {{ pager }}
    </footer>
  </div>
</article>
